<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Almendra";src:url(ui/almendra-400.woff2) format("woff2")}
@font-face{font-family:"Pinyon";src:url(fonts/pinyon-script-latin-400-normal.woff2) format("woff2")}
html,body{margin:0;height:100%;background:#2a1a10 radial-gradient(circle at 50% 40%,#4a2e1c,#1c110a);overflow:hidden}
#s{position:absolute;left:50%;top:50%;height:620px;aspect-ratio:606/930;transform:translate(-50%,-50%);filter:drop-shadow(0 16px 24px rgba(0,0,0,.6))}
.sBg{position:absolute;inset:0;background:url(ui/quill-scroll.webp) center/100% 100% no-repeat}
.sIn{position:absolute;left:17%;right:15%;top:15%;bottom:14%;overflow:hidden;color:#24160a}
em{display:block;font:600 11px Arial;letter-spacing:.18em;text-transform:uppercase;color:#8a1c14;font-style:normal;margin-bottom:8px}
b{display:block;font:28px/1.2 'Almendra',Georgia,serif;margin:0 0 14px;color:#3a1608;font-weight:400}
p{margin:0;font:500 21px/1.5 'EB Garamond',Georgia,serif}
.wd{white-space:nowrap}.ink{display:inline-block;color:#0d0703;transition:color 1.4s}.ink.on{color:inherit}
.quill{position:absolute;left:0;top:0;width:200px;pointer-events:none;transform-origin:0 100%;filter:drop-shadow(4px 8px 6px rgba(0,0,0,.35));-webkit-mask-image:linear-gradient(to right,#000 78%,transparent 99%)}
/* mode 3: unroll */
.roll{position:absolute;left:0;right:0;height:8.6%;background:url(ui/quill-scroll.webp) center bottom/100% 1163% no-repeat;z-index:3}
/* mode 4: bloom */
.bw{display:inline-block;opacity:0;filter:blur(7px);transform:scale(1.25);color:#000;transition:opacity .5s,filter 1.1s ease-out,transform 1.1s ease-out,color 1.6s}
.bw.on{opacity:1;filter:none;transform:none;color:inherit}
svg text{font-family:'Pinyon';fill:#24160a;fill-opacity:0;stroke:#24160a;stroke-width:.6}
</style></head><body>
<div id="s"><div class="sBg"></div><div class="sIn"><em>Hidden pattern</em><b id="t"></b><p id="b"></p></div></div>
<script>
const TITLE='An upside-down triangle',BODY='Draw lines between Iblis, Zahhak and Mirdas and you get a triangle standing on its tip. Balanced on a point, it is the least steady shape there is: a kingdom about to tip over.';
const mode=+location.hash.slice(1)||1,c=document.getElementById('s'),bEl=document.getElementById('t'),pEl=document.getElementById('b');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.fonts.ready.then(async()=>{await sleep(300);window.START=performance.now();
if(mode===1){
  const q=document.createElement('img');q.className='quill';q.src='ui/quill-hand.webp';c.appendChild(q);
  const wrap=(el,txt)=>{el.textContent='';const out=[];txt.split(' ').forEach((wd,k)=>{if(k)el.appendChild(document.createTextNode(' '));const w=document.createElement('span');w.className='wd';
    for(const ch of wd){const s=document.createElement('span');s.textContent=ch;s.className='ink';w.appendChild(s);out.push(s);}el.appendChild(w);});return out;};
  const LT=wrap(bEl,TITLE),LB=wrap(pEl,BODY),L=[...LT,...LB];L.forEach(s=>s.style.clipPath='inset(-25% 100% -25% -10%)');
  const R=c.getBoundingClientRect(),lines=[];
  for(const s of L){const r=s.getBoundingClientRect(),o={el:s,x0:r.left-R.left,x1:r.right-R.left,y:r.bottom-R.top,title:LT.includes(s)};
    let ln=lines[lines.length-1];if(!ln||Math.abs(ln.y-o.y)>6||ln.title!==o.title){ln={y:o.y,title:o.title,ch:[]};lines.push(ln);}ln.ch.push(o);}
  const S=[];let prev=null;for(const ln of lines){const a=ln.ch[0].x0,b=ln.ch[ln.ch.length-1].x1;
    if(prev)S.push({k:'mv',x0:prev.x,y0:prev.y,x1:a,y1:ln.y,d:prev.title!==ln.title?.55:.28});
    S.push({k:'wr',ln,x0:a,x1:b,y:ln.y,d:(b-a)/(ln.title?220:340)});prev={x:b,y:ln.y,title:ln.title};}
  const place=(x,y,t,wr)=>{q.style.transform=`translate(${x-2}px,${y-q.offsetHeight+3+(wr?Math.sin(t*38)*1.3:0)}px) rotate(${wr?Math.sin(t*19)*1.2:-3}deg)`;};
  const reveal=(ln,x)=>{for(const o of ln.ch){const f=Math.max(0,Math.min(1,(x-o.x0)/Math.max(1,o.x1-o.x0)));if(f>=1){if(!o.d){o.d=1;o.el.style.clipPath='none';o.el.classList.add('on');}}else o.el.style.clipPath=`inset(-25% ${(1-f)*100}% -25% -10%)`;}};
  place(S[0].x0,S[0].y,0,false);let t0=0;
  const step=now=>{if(!t0)t0=now;let t=(now-t0)/1000,T=t;for(const g of S){if(t>g.d){if(g.k==='wr')reveal(g.ln,g.x1+1);t-=g.d;continue;}
    const k=t/g.d;if(g.k==='wr'){const x=g.x0+(g.x1-g.x0)*k;reveal(g.ln,x);place(x,g.y,T,true);}else{const e=k*k*(3-2*k);place(g.x0+(g.x1-g.x0)*e,g.y0+(g.y1-g.y0)*e-Math.sin(k*Math.PI)*(g.d>.5?40:14),T,false);}
    requestAnimationFrame(step);return;}q.style.transition='transform 1s ease-in,opacity .8s';q.style.transform='translate(130%,40%) rotate(8deg)';q.style.opacity=0;};
  requestAnimationFrame(step);
}
if(mode===2){
  bEl.textContent='';pEl.textContent='';const W=c.querySelector('.sIn').clientWidth;const cv=document.createElement('canvas').getContext('2d');
  const lines=(txt,font)=>{cv.font=font;const out=[];let cur='';for(const w of txt.split(' ')){const t=cur?cur+' '+w:w;if(cv.measureText(t).width>W&&cur){out.push(cur);cur=w;}else cur=t;}out.push(cur);return out;};
  const T=lines(TITLE,'40px Pinyon'),B=lines(BODY,'27px Pinyon');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',W);svg.setAttribute('height',520);pEl.appendChild(svg);bEl.style.display='none';
  let y=40;const items=[];for(const l of T){items.push([l,40,y]);y+=46;}y+=10;for(const l of B){items.push([l,27,y]);y+=34;}
  for(const [l,fs,yy] of items){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',0);t.setAttribute('y',yy);t.setAttribute('font-size',fs);t.textContent=l;svg.appendChild(t);
    const len=l.length*fs*.9;t.style.strokeDasharray=len;t.style.strokeDashoffset=len;}
  for(const t of svg.querySelectorAll('text')){const len=+t.style.strokeDasharray.replace('px',''),d=Math.max(.5,t.textContent.length*.045);
    t.style.transition=`stroke-dashoffset ${d}s linear, fill-opacity .6s ${d*.7}s`;void t.getBoundingClientRect();t.style.strokeDashoffset=0;t.style.fillOpacity=1;await sleep(d*1000*.8);}
}
if(mode===3){
  bEl.textContent=TITLE;pEl.textContent=BODY;const bg=c.querySelector('.sBg'),inn=c.querySelector('.sIn');const r=document.createElement('div');r.className='roll';c.appendChild(r);
  const top=0.06,D=4200;let t0=0;const step=now=>{if(!t0)t0=now;const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,2.2),h=top+(1-top)*e;
    const cut=(1-h)*100;bg.style.clipPath=`inset(0 0 ${cut}% 0)`;inn.style.clipPath=`inset(0 0 ${Math.max(0,Math.min(100,(1-(h-.15)/.71)*100))}% 0)`;r.style.top=`calc(${h*100}% - 8.6%)`;if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
if(mode===4){
  const words=(el,txt)=>{el.textContent='';return txt.split(' ').map((w,k)=>{if(k)el.appendChild(document.createTextNode(' '));const s=document.createElement('span');s.className='bw';s.textContent=w;el.appendChild(s);return s;});};
  const A=[...words(bEl,TITLE),...words(pEl,BODY)];for(let i=0;i<A.length;i++){A[i].classList.add('on');await sleep(i<4?260:120);}
}
});
</script></body></html>
